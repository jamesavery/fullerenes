# spec.toml — what the binding generator (gen_bindings.py) binds.
#
# One [[klass]] per Python class. The generator harvests public methods from the
# C++ view chain (`harvest`, leaf first; a leaf method hides a base method of the
# same name), classifies each by its return/parameter types, and emits the
# mechanical .def surface into src/bindings_generated.cc plus a .pyi stub.
# Anything it cannot classify goes to unbound_report.md (never silently dropped).
#
# Where a hand-written stub goes (three cases, one convention -- un-indented .pyi
# body lines; the generator adds the 4-space indent):
#   - a HARVESTED class (has a C++ view) that also has hand-written methods:
#     a [[klass]] with `extra_stub` (the generated defs + your extra_stub lines).
#   - a NON-harvested class (bound by hand in module.cc/isomerdb.cc/enumeration.cc,
#     no view to harvest): a [[preamble_klass]] (pyname + stub body lines).
#   - a module-level function: a line in [meta].pyi_module_functions.
# Keep any new [meta] key ABOVE the [[preamble_klass]] blocks (a bare key after
# them attaches to the last preamble table, not to [meta]).
#
# [[klass]] fields:
#   pyname     Python class name.
#   owned/view C++ owned class and its (possibly templated) view; the wrapper is
#              pyf::PyGraph<owned,view> (wrapper="graph", default) or
#              pyf::PyGeom<owned,view> (wrapper="geom", carries coord3d points).
#   harvest    C++ view classes (AST names, no template args) to harvest from.
#   skip       method names handled by the hand-written .cc (not re-bound).
#   extra_stub hand-written methods, as .pyi lines, so the stub is complete.
# [[preamble_klass]]: pyname + stub (un-indented .pyi body lines).

[meta]
# Provided by the hand-written core (bind_*_common) or batchability contract noise.
skip = ["is_a_fullerene", "to_tuple", "get_size_factors", "polar_mapping"]
# Top-level .pyi function stubs (module funcs, hand-written like preamble_klass).
pyi_module_functions = [
  'def version() -> str: ...',
  'def number_isomers(N: int, sym: str = ..., IPR: bool = ...) -> int: ...',
  'def symmetries(N: int, IPR: bool = ...) -> list[str]: ...',
  'def buckygen(N: int, IPR: bool = ..., only_nontrivial: bool = ...) -> "BuckyGenerator": ...',
  'def set_database_path(path: str) -> None: ...',
  'def get_database_path() -> str: ...',
]

# Hand-written .pyi class stubs for classes the generator does NOT harvest (no
# [[klass]] -- bound by hand in module.cc/isomerdb.cc/enumeration.cc). Emitted into
# the preamble; body lines are indented by the generator, same convention as the
# per-klass `extra_stub`.
[[preamble_klass]]
pyname = "OptResult"
stub = [
  'CONVERGED: OptResult',
  'STAGNATED: OptResult',
  'BUDGET_EXHAUSTED: OptResult',
  'CONVEXITY_STUCK: OptResult',
]

[[preamble_klass]]
pyname = "MassModel"
stub = [
  'SOLID: MassModel',
  'ATOMS: MassModel',
]

[[preamble_klass]]
pyname = "Symmetry"
stub = [
  'def __init__(self, dual: "FullereneDual") -> None: ...',
  'def point_group(self) -> str: ...',
  'def order(self) -> int: ...',
  'def equivalence_classes(self) -> list[list[int]]: ...',
  'def representation_3d(self) -> numpy.ndarray: ...',
]

[[preamble_klass]]
pyname = "IsomerEntry"
stub = [
  'group: str',
  'rspi: list[int]',
  'hlgap: float',
]

[[preamble_klass]]
pyname = "IsomerDB"
stub = [
  'N: int',
  'IPR: bool',
  'n_isomers: int',
  '@staticmethod',
  'def read(N: int, IPR: bool = ...) -> "IsomerDB": ...',
  'def __len__(self) -> int: ...',
  'def __getitem__(self, i: int) -> IsomerEntry: ...',
  'def make_isomer(self, i: int) -> "FullereneGraph": ...',
]

[[preamble_klass]]
pyname = "BuckyGenerator"
stub = [
  'def __iter__(self) -> "BuckyGenerator": ...',
  'def __next__(self) -> "FullereneDual": ...',
  'def __enter__(self) -> "BuckyGenerator": ...',
  'def __exit__(self, exc_type: object, exc: object, tb: object) -> bool: ...',
  'def close(self) -> None: ...',
]

[[klass]]
pyname  = "FullereneGraph"
owned   = "FullereneGraph"
view    = "FullereneGraphView"
wrapper = "graph"
harvest = ["FullereneGraphView", "CubicGraphView", "PlanarGraphView", "GraphView"]
# Hand-written transforms (C++ view method names; params + owned return).
skip = ["GCtransform", "leapfrog_fullerene", "halma_fullerene"]
extra_stub = [
  '@staticmethod',
  'def C20() -> "FullereneGraph": ...',
  '@staticmethod',
  'def from_arrays(neighbours: numpy.ndarray, deg: numpy.ndarray | None = ...) -> "FullereneGraph": ...',
  'def name(self) -> str: ...',
  'def dual(self) -> "FullereneDual": ...',
  'def gc_transform(self, k: int, l: int = ...) -> "FullereneGraph": ...',
  'def leapfrog(self) -> "FullereneGraph": ...',
  'def halma(self, n: int) -> "FullereneGraph": ...',
]

