[[klass]]
pyname  = "Polyhedron"
owned   = "Polyhedron"
view    = "PolyhedronView<double>"
wrapper = "geom"
harvest = ["PolyhedronView", "PlanarGraphView", "GraphView"]
# Hand-written in polyhedron.cc. These are the C++ VIEW method names the
# generator harvests (NOT the Python names), listed explicitly so the generator
# never emits a duplicate .def if a library signature change (e.g. faces losing
# its default arg) would otherwise make one classifiable. (write/to_povray/
# to_latex are owned-Polyhedron methods, not harvested, so they need no skip.)
skip = ["bounding_box", "faces", "optimize", "move_to_origin", "align_with_axes",
        "scale", "move", "incremental_convex_hull", "dual", "leapfrog_dual",
        "inertia_matrix", "principal_axes"]
extra_stub = [
  '@staticmethod',
  'def from_fullerene(graph: "FullereneGraph", verbose: bool = ...) -> "Polyhedron": ...',
  '@staticmethod',
  'def C20() -> "Polyhedron": ...',
  '@staticmethod',
  'def from_arrays(neighbours: numpy.ndarray, points: numpy.ndarray, deg: numpy.ndarray | None = ...) -> "Polyhedron": ...',
  '@staticmethod',
  'def from_file(path: str) -> "Polyhedron": ...',
  'def bounding_box(self) -> tuple[numpy.ndarray, numpy.ndarray]: ...',
  'def faces(self) -> list[list[int]]: ...',
  'def inertia_matrix(self, mass_model: "MassModel" = ...) -> numpy.ndarray: ...',
  'def principal_axes(self, mass_model: "MassModel" = ...) -> numpy.ndarray: ...',
  'def optimize(self, method: int = ..., ftol: float = ..., verbose: bool = ...) -> bool: ...',
  'def move_to_origin(self) -> None: ...',
  'def align_with_axes(self, mass_model: "MassModel" = ...) -> None: ...',
  'def scale(self, s) -> None: ...',
  'def move(self, d) -> None: ...',
  'def convex_hull(self) -> "Polyhedron": ...',
  'def dual(self) -> "Polyhedron": ...',
  'def leapfrog_dual(self) -> "Polyhedron": ...',
  'def write(self, path: str) -> bool: ...',
  'def to_povray(self) -> str: ...',
  'def to_latex(self) -> str: ...',
]

[[klass]]
pyname  = "Deltahedron"
owned   = "Deltahedron"
view    = "DeltahedronView<double>"
wrapper = "geom"
harvest = ["DeltahedronView", "TriangulationView", "PlanarGraphView", "GraphView"]
# Hand-written in deltahedron.cc -- C++ VIEW method names harvested by the
# generator (the transforms are GCtransform/halma_transform on the view; the
# Python names are gc_transform/halma). optimize is on the owned Deltahedron,
# not the view, so it is not harvested.
skip = ["smooth", "reflect_concave", "reflect_all_concave",
        "GCtransform", "halma_transform"]
extra_stub = [
  '@staticmethod',
  'def from_dual(dual: "FullereneDual") -> "Deltahedron": ...',
  '@staticmethod',
  'def from_arrays(neighbours: numpy.ndarray, points: numpy.ndarray, deg: numpy.ndarray | None = ...) -> "Deltahedron": ...',
  'def smooth(self, q: float) -> None: ...',
  'def reflect_concave(self, threshold: float = ...) -> int: ...',
  'def reflect_all_concave(self, threshold: float = ...) -> int: ...',
  'def optimize(self, target_L: float = ..., grad_tol: float = ..., max_work: int = ..., angle_tol: float = ...) -> "OptResult": ...',
  'def gc_transform(self, k: int, l: int = ...) -> "Deltahedron": ...',
  'def halma(self, m: int) -> "Deltahedron": ...',
  'iterations_used: int',
  'final_gmax_L: float',
  'final_angle_relerr: float',
  'final_n_concave: int',
  'final_opt_result: "OptResult"',
]
