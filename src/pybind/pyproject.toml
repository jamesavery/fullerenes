[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "fullerenes"
version = "0.0.1"
description = "Python bindings for the fullerene C++ library (topology, geometry, enumeration)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["fullerenes"]
build-dir = "build/{wheel_tag}"
# Generated stubs / bindings live in the tree; ship the package as-is.
sdist.include = ["src", "tools", "CMakeLists.txt"]
# Editable installs rebuild the extension on import, so `pip install -e .` stays
# current with C++ edits. NOTE: an editable install resolves _fullerenes from its
# own build dir, NOT the source-tree .so that `cmake --build build-py` writes --
# so do not mix the two; for active dev use the cmake build-py + source-tree
# import path (see README / .claude/build-config.toml), or the editable install,
# but not both at once (the editable finder shadows the source-tree build).
editable.rebuild = true

[tool.scikit-build.cmake.define]
# ABI: match the compiler libfullerenes.so was built with (clang++ 23).
CMAKE_CXX_COMPILER = "clang++"
